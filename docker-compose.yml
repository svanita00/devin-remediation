services:
  control-plane:
    build: .
    ports:
      - "8000:8000"
    # .env is optional. A fresh clone with no .env runs in mock mode ($0) via the
    # defaults in app/config.py. Copy .env.example -> .env and set DEVIN_MODE=live
    # + DEVIN_API_KEY to drive real Devin.
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    restart: unless-stopped
